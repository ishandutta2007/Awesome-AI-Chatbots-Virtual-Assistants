<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.05)" />
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.15)" />
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.05)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .floating-node-1 { animation: float1 6s ease-in-out infinite; }
      .floating-node-2 { animation: float2 8s ease-in-out infinite; }
      .floating-node-3 { animation: float3 7s ease-in-out infinite; }
      .pulse-line { animation: pulseDash 3s linear infinite; }
      .wave-pulse { animation: wave 4s ease-in-out infinite; }

      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(15px) rotate(-2deg); }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulseDash {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes wave {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
    </style>
  </defs>

  <!-- Background Animated Network Grid / Nodes (Layer 0 - Background) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="3" fill="#38bdf8" class="floating-node-1" />
    <circle cx="280" cy="60" r="4" fill="#818cf8" class="floating-node-2" />
    <circle cx="1050" cy="90" r="3" fill="#c084fc" class="floating-node-3" />
    <circle cx="920" cy="70" r="5" fill="#38bdf8" class="floating-node-1" />
    <circle cx="1100" cy="320" r="4" fill="#818cf8" class="floating-node-2" />
    <circle cx="100" cy="330" r="4" fill="#c084fc" class="floating-node-3" />
  </g>

  <!-- Dynamic Connecting Network Flows (Layer 1 - Background Flow) -->
  <g stroke="url(#title-gradient)" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 50 350 Q 300 300, 600 350 T 1150 350" stroke-dasharray="8 6" class="pulse-line" />
    <path d="M 100 50 Q 400 120, 800 50 T 1100 80" stroke-dasharray="6 6" class="pulse-line" />
  </g>

  <!-- Animated Floating AI Feature Cards (Layer 2 - Left & Right Flanks) -->
  <!-- Left Flank Pill Card: Conversational NLU -->
  <g class="floating-node-1" transform="translate(60, 110)">
    <rect width="210" height="54" rx="27" fill="url(#card-grad-1)" stroke="#38bdf8" stroke-width="1.5" opacity="0.85" />
    <circle cx="30" cy="27" r="16" fill="#38bdf8" opacity="0.2" />
    <text x="30" y="32" font-size="16" text-anchor="middle" fill="#38bdf8">🧠</text>
    <text x="60" y="32" font-size="13" font-weight="600" fill="#e2e8f0">Conversational NLU</text>
  </g>

  <!-- Left Flank Pill Card: Autonomous Agents -->
  <g class="floating-node-2" transform="translate(90, 220)">
    <rect width="200" height="54" rx="27" fill="url(#card-grad-2)" stroke="#c084fc" stroke-width="1.5" opacity="0.85" />
    <circle cx="30" cy="27" r="16" fill="#c084fc" opacity="0.2" />
    <text x="30" y="32" font-size="16" text-anchor="middle" fill="#c084fc">🤖</text>
    <text x="60" y="32" font-size="13" font-weight="600" fill="#e2e8f0">Autonomous Agents</text>
  </g>

  <!-- Right Flank Pill Card: Voice & WebRTC -->
  <g class="floating-node-3" transform="translate(930, 110)">
    <rect width="210" height="54" rx="27" fill="url(#card-grad-2)" stroke="#c084fc" stroke-width="1.5" opacity="0.85" />
    <circle cx="30" cy="27" r="16" fill="#c084fc" opacity="0.2" />
    <text x="30" y="32" font-size="16" text-anchor="middle" fill="#c084fc">🎙️</text>
    <text x="60" y="32" font-size="13" font-weight="600" fill="#e2e8f0">Voice &amp; WebRTC AI</text>
  </g>

  <!-- Right Flank Pill Card: RAG & Workflows -->
  <g class="floating-node-1" transform="translate(900, 220)">
    <rect width="210" height="54" rx="27" fill="url(#card-grad-1)" stroke="#38bdf8" stroke-width="1.5" opacity="0.85" />
    <circle cx="30" cy="27" r="16" fill="#38bdf8" opacity="0.2" />
    <text x="30" y="32" font-size="16" text-anchor="middle" fill="#38bdf8">⚡</text>
    <text x="60" y="32" font-size="13" font-weight="600" fill="#e2e8f0">RAG &amp; Workflows</text>
  </g>

  <!-- FOREGROUND TEXT CONTENT (Layer 3 - High Visibility Center - Cannot be obscured) -->
  <g text-anchor="middle">
    <!-- Glowing Accent Badge above Title -->
    <rect x="475" y="65" width="250" height="32" rx="16" fill="rgba(129, 140, 248, 0.18)" stroke="#818cf8" stroke-width="1" />
    <text x="600" y="86" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">OCTOBER 2026 EDITION</text>

    <!-- Main Title -->
    <text x="600" y="165" font-size="44" font-weight="800" fill="url(#title-gradient)" filter="url(#glow-blue)" letter-spacing="-0.5">
      Awesome AI Chatbots &amp; Virtual Assistants
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Directory of Commercial Customer Service AI &amp; Open-Source Agent Frameworks
    </text>

    <!-- Dynamic Tech Stack Pills below Subtitle -->
    <g transform="translate(360, 255)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="115" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="57" y="19" font-size="12" font-weight="600" fill="#cbd5e1">SaaS &amp; CRM</text>
      <!-- Pill 2 -->
      <rect x="125" y="0" width="115" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="182" y="19" font-size="12" font-weight="600" fill="#cbd5e1">Open-Source</text>
      <!-- Pill 3 -->
      <rect x="250" y="0" width="115" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="307" y="19" font-size="12" font-weight="600" fill="#cbd5e1">LLMOps &amp; RAG</text>
      <!-- Pill 4 -->
      <rect x="375" y="0" width="105" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="427" y="19" font-size="12" font-weight="600" fill="#cbd5e1">Voice Agents</text>
    </g>
  </g>
</svg>
